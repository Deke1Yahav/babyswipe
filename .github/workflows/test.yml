name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Run policy tests
        run: |
          # Postgres refuses to run as the runner user, so run a copy as the postgres user.
          sudo mkdir /tmp/db-test && sudo cp -r supabase /tmp/db-test/ && sudo chown -R postgres /tmp/db-test
          sudo -u postgres env TMPDIR=/tmp bash -c 'cd /tmp/db-test && bash supabase/tests/run_local.sh' | tee /tmp/db-test-out.txt
          grep -q "ALL POLICY TESTS PASSED" /tmp/db-test-out.txt
          grep -q "ALL VERIFICATION AND REVIEW TESTS PASSED" /tmp/db-test-out.txt
          grep -q "ALL PROFILE TESTS PASSED" /tmp/db-test-out.txt
