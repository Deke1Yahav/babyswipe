name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Run policy tests
        run: |
          sudo chown -R postgres "$GITHUB_WORKSPACE"
          sudo -u postgres env TMPDIR=/tmp bash supabase/tests/run_local.sh | tee out.txt
          grep -q "ALL POLICY TESTS PASSED" out.txt
